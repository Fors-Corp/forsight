# Runs forsight on every node in the cluster, reusing the SAME host and Docker
# collectors as a bare-metal install — no Kubernetes-specific collector code
# exists (see internal/collector/host's package doc). The trick: gopsutil
# honors HOST_PROC/HOST_SYS overrides (the same convention node_exporter
# uses), so mounting the host's /proc and /sys into the pod and pointing
# those env vars at the mount is all it takes to get real node-level metrics
# from this binary unmodified.
#
# Docker-socket mount: only meaningful on nodes whose container runtime is
# Docker. Most current clusters run containerd or CRI-O directly, which don't
# expose a Docker-compatible socket — forsight's Docker collector requires the
# Docker API specifically (see internal/collector/docker's package doc), not
# the CRI API, so it simply won't register on such nodes (same graceful
# unavailability as a bare-metal host with no Docker running). If NO node in
# your cluster runs Docker, delete the docker-sock volume/volumeMount below
# entirely rather than leaving a hostPath that never resolves to anything.
#
# No RBAC is defined here because none is needed: this manifest gives forsight
# no Kubernetes API access at all (it never calls the apiserver) — the
# dedicated ServiceAccount below exists only so the pod doesn't inherit
# whatever permissions the namespace's "default" ServiceAccount happens to
# carry, not because forsight itself needs any.
#
# TLS: this DaemonSet listens on a non-loopback address (every node's own
# interface), which is exactly the case --tls-cert/--tls-key exist for — see
# the README's "TLS" section. Nothing below turns it on, since that needs a
# real certificate this file can't provide; the commented-out lines are the
# shape of it with cert-manager (https://cert-manager.io) issuing one. Ask
# cert-manager for a Secret named e.g. forsight-tls (a Certificate resource
# with secretName: forsight-tls, in this namespace), then:
#   - args: ["run", "--tls-cert=/etc/forsight/tls/tls.crt", "--tls-key=/etc/forsight/tls/tls.key"]
#   - volumeMounts:
#       - name: tls
#         mountPath: /etc/forsight/tls
#         readOnly: true
#   - volumes:
#       - name: tls
#         secret:
#           secretName: forsight-tls
# Add --tls-client-ca (another mounted PEM, e.g. from a cert-manager-issued
# CA bundle Secret) if you also want the dashboard's callers to present a
# client certificate (mTLS), on top of or instead of --auth-token.
apiVersion: v1
kind: Namespace
metadata:
  name: forsight
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: forsight
  namespace: forsight
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: forsight
  namespace: forsight
  labels:
    app.kubernetes.io/name: forsight
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: forsight
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forsight
    spec:
      serviceAccountName: forsight
      containers:
        - name: forsight
          image: ghcr.io/marcfs31/forsight:latest
          args: ["run"]
          env:
            - name: HOST_PROC
              value: /host/proc
            - name: HOST_SYS
              value: /host/sys
            - name: DOCKER_HOST
              value: unix:///host/docker.sock
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: proc
              mountPath: /host/proc
              readOnly: true
            - name: sys
              mountPath: /host/sys
              readOnly: true
            - name: docker-sock
              mountPath: /host/docker.sock
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: proc
          hostPath:
            path: /proc
        - name: sys
          hostPath:
            path: /sys
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
