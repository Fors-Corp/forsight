name: CodeQL

# Static analysis for security *and* code quality (the `security-and-quality`
# suite adds maintainability/correctness queries to the default security set).
# Both "Analyze (…)" jobs are required status checks on `main`, so the analysis
# must RUN and succeed before a merge. Note what that does and does not mean:
# `github/codeql-action/analyze` does not fail its job because an alert was
# found, so these two checks prove the scan happened, not that it was clean.
# The check that reflects findings on a PR is "Code scanning results / CodeQL",
# produced by the `pull_request` analysis. New findings are fixed at the source
# — never suppressed — by the standing mandate in CLAUDE.md and the triage
# routine it names; see CONTRIBUTING.md "Security & code-quality policy".
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "45 18 * * 1" # weekly, catches newly published queries/advisories
  # Dispatched by dependabot-automerge.yml / release.yml on a head they moved
  # with GITHUB_TOKEN. Such pushes create no workflow runs of their own
  # (workflow_dispatch is the documented exception); a PR opened or updated by
  # GITHUB_TOKEN does produce `pull_request` runs, but parked in an
  # approval-required state, so the dispatched run is what actually reports.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload SARIF results
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: go
            build-mode: manual
    steps:
      - uses: actions/checkout@v7
      - if: matrix.language == 'go'
        uses: actions/setup-go@v7
        with:
          go-version-file: forsight/go.mod
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality
      - if: matrix.language == 'go'
        run: go build ./...
        working-directory: forsight
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
