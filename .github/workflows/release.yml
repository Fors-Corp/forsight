name: Release

# Gated on CI, not on the push itself — `npm run release` only builds and
# publishes, it doesn't re-run lint/tests, so this must never fire on a red
# `main`. Runs after the "CI" workflow completes on `main`.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

# Declared per job. The `release` job executes build and lifecycle scripts from
# every transitive dependency, so it must not hold a scope it doesn't need —
# `actions: write` in particular lives in the separate `arm-version-pr` job
# below, which runs no dependency code at all. Actions has no per-step
# permission scoping, which is why this is a job split and not a step.
permissions: {}

env:
  # Kept in step with dependabot-automerge.yml's REQUIRED_WORKFLOWS: the
  # workflows whose jobs are required status checks on `main`.
  REQUIRED_WORKFLOWS: ci.yml codeql.yml forsight-ci.yml

jobs:
  release:
    # The ref guard matters on the workflow_dispatch path: without it a
    # dispatch on any branch would check that branch out and run the full
    # publish from its tree. The workflow_run path is already filtered to main
    # by `branches:` above.
    if: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the version commit/tag; create the GitHub Release
      pull-requests: write # open/update the "Version Packages" PR
      packages: write # changeset publish -> GitHub Packages
    outputs:
      versionPr: ${{ steps.changesets.outputs.pullRequestNumber }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Changesets needs the full history to diff changeset files against.
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@fors-corp"

      - run: npm ci

      # If changesets are pending, opens/updates a "Version Packages" PR
      # (running `version-packages`). Once that PR is merged (so there are
      # no pending changesets left), runs `release` (build + `changeset
      # publish`) instead — publishing to GitHub Packages using the
      # workflow's own GITHUB_TOKEN (same-repo publish needs no separate
      # PAT/secret; see NODE_AUTH_TOKEN below) — and tags + creates a
      # GitHub Release for what it published.
      # Pinned to the commit of the real upstream v1.9.0 tag (verified with
      # `gh api repos/changesets/action/tags`), not a mutable major tag —
      # CodeQL's unpinned-tag check flags third-party Actions.
      #
      # Pinned to v1.9.0 deliberately, NOT v2. v2's inputs were migrated
      # correctly (version -> version-script, publish -> publish-script,
      # commit -> commit-message, title -> pr-title, outputs
      # .pullRequestNumber -> outputs.pr-number) and it still refused to run:
      # "This version of the Changesets action is designed to work with
      # Changesets CLI v3". And @changesets/cli v3 declares engines
      # `node ^22.11 || ^24 || >=26` and calls module.enableCompileCache(),
      # so it cannot run on the Node 20 this repo still supports in CI and in
      # .nvmrc. The v2 migration therefore waits on dropping Node 20 — the
      # same blocker as size-limit 13 and jsdom 30. Until then this stays on
      # v1.9.0 with v1 input names, and dependabot-automerge.yml refuses to
      # auto-merge Action majors so it cannot be re-broken unattended.
      - uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        id: changesets
        with:
          version: npm run version-packages
          publish: npm run release
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Separate job, so the token that can dispatch workflows is never present in
  # the job that runs dependency code. The action pushes the "Version Packages"
  # PR with GITHUB_TOKEN, which creates no workflow runs, so its required
  # checks would sit at "expected" forever. Dispatch them explicitly
  # (`workflow_dispatch` is the documented exception) and arm native
  # auto-merge: once green the PR merges itself, Release runs again on the
  # merge commit with no pending changesets, and the publish path above ships
  # the release. That is continuous release — every changeset that lands on
  # `main` becomes a version without a human clicking anything (Marc's standing
  # rule, see CLAUDE.md).
  arm-version-pr:
    needs: release
    if: ${{ needs.release.outputs.versionPr != '' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write # gh pr merge --auto
      actions: write # gh workflow run
    steps:
      - name: Run the required checks on the version PR and arm auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ needs.release.outputs.versionPr }}
          # changesets/action derives its branch from the ref it ran on
          # (`changeset-release/<branch>`), so derive it the same way rather
          # than hardcoding `main`.
          VERSION_BRANCH: changeset-release/${{ github.event.workflow_run.head_branch || github.ref_name }}
        run: |
          set -uo pipefail
          for wf in $REQUIRED_WORKFLOWS; do
            gh workflow run "$wf" --ref "$VERSION_BRANCH" || echo "::warning::could not dispatch $wf on $VERSION_BRANCH"
          done
          if ! gh pr merge --squash --auto "$PR"; then
            state=$(gh pr view "$PR" --json mergeStateStatus -q .mergeStateStatus || echo UNKNOWN)
            if [ "$state" = "CLEAN" ]; then
              gh pr merge --squash "$PR" || echo "::warning::version PR #$PR is CLEAN but would not merge."
            else
              echo "::notice::version PR #$PR: auto-merge not armed by this run (state=$state)."
            fi
          fi
          # dependabot-automerge.yml's `refresh` job re-arms this PR on a
          # schedule too, so a single failure here does not stall the release.
