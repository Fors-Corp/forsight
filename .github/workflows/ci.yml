name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # `push:` above is not the safety net it looks like. Native auto-merge
    # completes its squash with GITHUB_TOKEN, and a push made with that token
    # creates no workflow runs at all — so `main` can go days without CI while
    # every PR merges green against a stale base. It did: the last `push` run
    # on `main` was 2026-09-21, and by 2026-10-01 `main` was red three ways
    # (a Calendar play test and a coverage threshold that both depended on the
    # wall clock, plus a new high-severity advisory) with nothing to show it.
    # A daily run on the default branch also catches exactly that class of
    # time bomb, which no diff-triggered run ever will. Same reasoning as
    # codeql.yml's weekly schedule; staggered off the hour.
    - cron: "17 7 * * *"
  # Dispatched by dependabot-automerge.yml / release.yml on a head they moved
  # with GITHUB_TOKEN. Such pushes create no workflow runs of their own
  # (workflow_dispatch is the documented exception); a PR opened or updated by
  # GITHUB_TOKEN does produce `pull_request` runs, but parked in an
  # approval-required state, so the dispatched run is what actually reports.
  workflow_dispatch:

# CI never writes to the repo — pin the token to read-only.
permissions:
  contents: read

jobs:
  verify:
    name: verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # These are DEV-toolchain versions, not the runtime floor for
        # consumers — package.json's `engines` stays >=18.18, because the
        # compiled dist is ES2020 and runs anywhere. Node 20 left active
        # support in April 2026 and had become the single constraint holding
        # back four upgrades (size-limit 13 needs fs.promises.glob from
        # 22.13, jsdom 30 declares ^22.22, @changesets/cli 3 declares ^22.11
        # and calls module.enableCompileCache, and changesets/action v2
        # requires that CLI). So: current LTS and current.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run smoke
      - run: npx size-limit
      - run: npm run test:package # publint + are-the-types-wrong on the built package

  audit:
    name: audit (npm audit, high+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # High/critical advisories anywhere in the tree block the merge — fix by
      # upgrading (or an `overrides` entry for a stuck transitive), never by
      # ignoring. Moderate/low ones arrive as Dependabot PRs instead.
      - run: npm audit --audit-level=high

  consumer:
    name: consumer (packed tarball in a Next.js + Tailwind v4 app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:consumer

  storybook:
    name: storybook (build + a11y/render test runner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build-storybook
      - run: npm run test:storybook:ci
