name: forsight CI

# Runs on every push to `main` and every PR with NO `paths:` filter, so both
# real jobs can be required status checks on `main`. The distinction that
# forces this shape: a job skipped by its own `if:` reports "skipped", which
# branch protection accepts as satisfied, whereas a workflow that never starts
# because of a `paths:` filter leaves its checks "expected" forever and blocks
# the merge. The cheap `changes` job decides what this diff can actually
# affect; `go` and `web` only do real work when it matters, and they run
# anyway whenever `changes` did not itself succeed — a broken detector must
# never wave the real checks through.
on:
  push:
    branches: [main]
  pull_request:
  # Dispatched by dependabot-automerge.yml / release.yml on a head they moved
  # with GITHUB_TOKEN. Such pushes create no workflow runs of their own
  # (workflow_dispatch is the documented exception); a PR opened or updated by
  # GITHUB_TOKEN does produce `pull_request` runs, but parked in an
  # approval-required state, so the dispatched run is what actually reports.
  workflow_dispatch:

# Never writes to the repo — pin the token to read-only, same as ci.yml.
permissions:
  contents: read

jobs:
  changes:
    name: changes (what this diff can affect)
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.detect.outputs.go }}
      web: ${{ steps.detect.outputs.web }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: detect
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base=""
          if [ "$EVENT" = "push" ] && [ -n "${BEFORE:-}" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            base="$BEFORE"
          else
            git fetch -q origin main
            base=$(git merge-base origin/main HEAD || true)
          fi
          changed=""
          if [ -n "$base" ] && [ "$base" != "$(git rev-parse HEAD)" ]; then
            changed=$(git diff --name-only "$base" HEAD || true)
          fi
          printf 'base=%s\nchanged files:\n%s\n' "${base:-<none>}" "$changed"
          go=false; web=false
          # The Go module itself (the dashboard's sources are the web job's concern).
          if grep -qE '^(forsight/(cmd|internal|deploy|main\.go|go\.(mod|sum)|Makefile|install\.sh)|forseer/|\.github/workflows/forsight-ci\.yml)' <<<"$changed"; then go=true; fi
          # What the embedded dashboard build is made of. Deliberately NOT the
          # design system's own sources: forsight/web depends on a pinned
          # published `@marcfs31/forsight` from GitHub Packages, so a root
          # `src/`/dependency change does not re-hash this bundle. Design-
          # system bumps land as an ordinary Dependabot PR on forsight/web's
          # package.json that rebuilds the embed. The embed is still a
          # snapshot — a forsight/web change must ship a refreshed
          # webdist/ via `make build-web` on the same PR. See CLAUDE.md,
          # "two artifacts".
          if grep -qE '^(forsight/web/|forsight/internal/api/webdist/|\.github/workflows/forsight-ci\.yml)' <<<"$changed"; then web=true; fi
          # No usable base (a dispatch on an unknown ref, a first push, a
          # history rewrite): fail open and run everything.
          if [ -z "$changed" ]; then go=true; web=true; fi
          echo "go=$go" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "go=$go web=$web"

  go:
    name: go (vet, lint, test, build)
    needs: changes
    # Fail closed: a `needs` failure would otherwise SKIP this job, and a
    # skipped job counts as success for branch protection.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.go == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: forsight/go.mod
      - run: go vet ./...
        working-directory: forsight
      # Pinned to a commit SHA, not the mutable "v9" tag — CodeQL's
      # unpinned-tag check flags third-party Actions specifically (the
      # first-party actions/* and github/* steps elsewhere in this repo's
      # workflows aren't flagged the same way); a tag can be moved to point
      # at different code after the fact, a SHA can't.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          working-directory: forsight
      - run: go test ./...
        working-directory: forsight
      - run: go vet ./...
        working-directory: forseer
      - run: go test ./...
        working-directory: forseer
      # Uses whatever is currently checked into internal/api/webdist/ (the
      # fallback page unless a prior "web" job step refreshed it) — this
      # step's whole point is proving `go build` never needs Node, so it
      # deliberately does not build forsight/web first.
      - run: go build ./...
        working-directory: forsight

  web:
    name: web (dashboard build, and it matches what's embedded)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.web == 'true') }}
    runs-on: ubuntu-latest
    # packages: read so npm ci can fetch the pinned @marcfs31/forsight from
    # GitHub Packages (same-repo package; GITHUB_TOKEN is enough).
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: forsight/web/package-lock.json
          registry-url: https://npm.pkg.github.com
          scope: "@marcfs31"
      # forsight/web depends on the published @marcfs31/forsight from GitHub
      # Packages; the lockfile resolves it from the registry (no file:../..
      # link), so a plain npm ci reproduces the tree exactly. GITHUB_TOKEN +
      # packages:read is enough for same-repo GitHub Packages.
      - run: npm ci --no-fund --no-audit
        working-directory: forsight/web
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # forsight/web has had a test suite, a vitest config and a vitest setup
      # for as long as it has had a dashboard, and nothing ever ran them — this
      # job installed, built, and diffed the embed. So App.test.tsx could have
      # been broken indefinitely without anyone noticing. Runs before the build
      # so a failing test is the error you see, not an embed mismatch
      # downstream of it.
      - run: npm test
        working-directory: forsight/web

      - run: npm run build
        working-directory: forsight/web
      # Vite's output is content-hashed, so an unchanged source tree
      # rebuilds byte-for-byte identical — if this diff is non-empty,
      # someone changed forsight/web (or bumped the design-system pin it
      # bundles) without running `make build-web` and committing the
      # refreshed embed, which is exactly the drift
      # internal/api/dashboard.go's doc comment warns against (see also
      # CONTRIBUTING.md's "Snapshots are reviewed, not rubber-stamped" —
      # the same discipline for a generated embed instead of a test
      # snapshot).
      - name: Diff the fresh build against internal/api/webdist/
        run: diff -rq forsight/web/dist forsight/internal/api/webdist
