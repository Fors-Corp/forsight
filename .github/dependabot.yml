version: 2
# Marc's standing rule (CLAUDE.md, "Dependabot / security / code-quality
# mandate"): every update Dependabot can propose is applied and merged
# automatically once CI is green — patch, minor and major alike. So nothing is
# ignored here except one hard blocker, the cadence is daily rather than
# weekly, and lockstep package families are grouped so they move together
# (the class that produced red PRs on 2026-09-09: a Storybook core bump
# without its addons, a plugin-react bump without Vite). The auto-merge itself
# is .github/workflows/dependabot-automerge.yml; anything that needs a real
# migration to go green is picked up by the triage routine described in
# CLAUDE.md.
registries:
  # @marcfs31/forsight (the design system this repo also publishes) lives on
  # GitHub Packages, a private registry. Without credentials here Dependabot
  # can't resolve it at all and silently proposes nothing — forsight/web's
  # pin drifted a full major behind (^3.0.0 vs the published 4.0.1) before
  # anyone noticed. token: needs its own Dependabot secret (Settings ->
  # Secrets and variables -> Dependabot); GITHUB_TOKEN isn't usable here.
  # Scope the PAT to read:packages only, nothing broader.
  npm-packages-github:
    type: npm-registry
    url: https://npm.pkg.github.com
    token: "${{secrets.DEPENDABOT_NPM_PACKAGES_TOKEN}}"
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    cooldown:
      # Nothing is merged the day it is published. `npm audit`/Dependabot
      # alerts only catch advisories that already exist, so a freshly
      # published malicious version has none — this window is what closes
      # that gap without a human in the loop. Everything still merges
      # automatically, just a few days later.
      default-days: 3
      semver-major-days: 7
    groups:
      radix:
        patterns:
          - "@radix-ui/*"
      storybook:
        patterns:
          - "@storybook/*"
          - "storybook"
      vite:
        patterns:
          - "vite"
          - "vitest"
          - "@vitest/*"
          - "@vitejs/*"
      eslint:
        patterns:
          - "eslint"
          - "@eslint/*"
          - "eslint-*"
          - "typescript-eslint"
          - "@typescript-eslint/*"
      testing-library:
        patterns:
          - "@testing-library/*"
      size-limit:
        patterns:
          - "size-limit"
          - "@size-limit/*"
    ignore:
      # The ONE deliberate exception — a hard blocker, not a policy choice:
      # typescript-eslint declares peer `typescript >=4.8.4 <6.1.0`, so
      # TypeScript 7 cannot even install next to it (`npm ci` fails with
      # ERESOLVE; that was PR #4 on 2026-09-09). Remove this entry the moment
      # typescript-eslint publishes support for TypeScript 7 — the triage
      # routine re-checks `npm view typescript-eslint peerDependencies` on
      # every pass and is told to drop it then.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Same shape, different blocker: @changesets/cli v3 declares engines
      # `node ^22.11 || ^24 || >=26` and calls module.enableCompileCache(),
      # so it cannot run on the Node 20 this repo still supports (.nvmrc and
      # the CI matrix). Remove this entry together with Node 20 — which also
      # unblocks size-limit 13 and jsdom 30, and lets changesets/action move
      # to v2 (v2 requires CLI v3; see release.yml).
      - dependency-name: "@changesets/cli"
        update-types: ["version-update:semver-major"]
      # A third peer blocker: @storybook/addon-vitest (10.6.0 and
      # 11.0.0-alpha.0) peers `vitest` / `@vitest/browser` at `^3.0.0 ||
      # ^4.0.0`, so the Vitest 5 group bump fails `npm ci` with ERESOLVE.
      # Closing that group PR doesn't ignore it, and it was reopened four
      # times (#45, #47, #68, #78). Vitest 4 minors and patches still flow.
      # Only the root is affected; forsight/web has no Storybook. Remove
      # when `npm view @storybook/addon-vitest peerDependencies` accepts ^5.
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/*"
        update-types: ["version-update:semver-major"]

  # The agent's dashboard (private, embedded into the Go binary). A bump here
  # changes forsight/internal/api/webdist/ — `make build-web` must be re-run
  # and the refreshed embed committed on the same PR, or the `web` check
  # fails by design (see forsight-ci.yml).
  - package-ecosystem: "npm"
    directory: "/forsight/web"
    registries:
      - npm-packages-github
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    cooldown:
      # Nothing is merged the day it is published. `npm audit`/Dependabot
      # alerts only catch advisories that already exist, so a freshly
      # published malicious version has none — this window is what closes
      # that gap without a human in the loop. Everything still merges
      # automatically, just a few days later.
      default-days: 3
      semver-major-days: 7
    groups:
      vite:
        patterns:
          - "vite"
          - "@vitejs/*"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
      types:
        patterns:
          - "@types/*"

  - package-ecosystem: "gomod"
    directory: "/forsight"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    cooldown:
      # Nothing is merged the day it is published. `npm audit`/Dependabot
      # alerts only catch advisories that already exist, so a freshly
      # published malicious version has none — this window is what closes
      # that gap without a human in the loop. Everything still merges
      # automatically, just a few days later.
      default-days: 3
      semver-major-days: 7
    groups:
      go-modules:
        patterns:
          - "*"

  # Actions are the highest-consequence ecosystem here: a bump rewrites a
  # `uses:` SHA, and `release.yml` executes those Actions with a token that can
  # publish. They still auto-merge (Marc's rule), but with the longest cooldown
  # in the file, so a compromised upstream release has days to be disclosed and
  # yanked before it can land unattended. To take Actions out of auto-merge
  # entirely, add `github-actions` to the ecosystem check in
  # dependabot-automerge.yml's `arm` job — one condition, nothing else changes.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    ignore:
      # changesets/action v2 requires Changesets CLI v3, which requires
      # Node ^22.11 — so it is blocked by the same Node 20 floor as
      # @changesets/cli, size-limit 13 and jsdom 30. It was auto-merged once
      # (PR #21), silently stopped publishing, and had to be reverted in
      # PR #34. Remove this together with Node 20.
      - dependency-name: "changesets/action"
        update-types: ["version-update:semver-major"]
    cooldown:
      # Only `default-days` here: Dependabot rejects `semver-major-days` for
      # the github-actions ecosystem ("not supported for the package
      # ecosystem 'github-actions'"), which made the whole config invalid.
      default-days: 7
